# =====================
# GENERAL
# =====================
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g xterm-keys on
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
bind-key -T prefix x kill-pane

# =====================
# RELOAD CONFIG
# =====================
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# =====================
# SPLITS
# =====================
bind '\' split-window -h
bind - split-window -v

# =====================
# NAVIGATION (Alt + Vim keys)
# =====================
bind -n M-h if -F '#{@pane-is-vim}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F '#{@pane-is-vim}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F '#{@pane-is-vim}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F '#{@pane-is-vim}' 'send-keys M-l' 'select-pane -R'

# =====================
# RESIZE (Ctrl + Alt + Vim keys)
# =====================
bind -n C-M-h if -F '#{@pane-is-vim}' 'send-keys C-M-h' 'resize-pane -L 5'
bind -n C-M-j if -F '#{@pane-is-vim}' 'send-keys C-M-j' 'resize-pane -D 5'
bind -n C-M-k if -F '#{@pane-is-vim}' 'send-keys C-M-k' 'resize-pane -U 5'
bind -n C-M-l if -F '#{@pane-is-vim}' 'send-keys C-M-l' 'resize-pane -R 5'

# =====================
# LAYOUT
# =====================
bind = select-layout even-horizontal
